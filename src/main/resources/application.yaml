spring:
  application:
    name: discodeit
  profiles:
    active: dev # 개발 환경(기본값; 로컬에서는 항상 dev로 뜸)

  #  datasource:
  #    url: jdbc:postgresql://localhost:5432/discodeit
  #    username: discodeit_user
  #    password: discodeit1234
  #    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false # OSIV 비활성화

  logging:
    level:
      root: info

  web:
    resources:
      static-locations: classpath:/static/dist2/

discodeit:
  storage:
    type: local
    local:
      root-path: ./uploads
